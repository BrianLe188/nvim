# Set terminal type
set -g default-terminal "xterm-256color"

# # Ghostty truecolor and undercurl support
# set -as terminal-overrides ",xterm-ghostty:Tc"
# set -as terminal-overrides ',xterm-ghostty:Smulx=\E[4::%p1%dm'
# set -as terminal-overrides ',xterm-ghostty:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# --- Shell ---
set-option -g default-shell $SHELL
set-option -g default-command ""

# Change prefix to C-a (no need to unbind C-b again)
set -g prefix C-a
bind-key C-a send-prefix
bind-key -r C-a send-prefix

# Enable mouse support
set -g mouse on

# Split windows more efficiently
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Resize panes with arrow keys
bind -r Down resize-pane -D 10 
bind -r Up resize-pane -U 10 
bind -r Left resize-pane -L 10 
bind -r Right resize-pane -R 10 

# Pane selection with vim-like keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Toggle zoom on a pane
bind -r m resize-pane -Z

# Enable vi mode in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# New window with same directory
bind c new-window -c '#{pane_current_path}'

# Start window index from 1, and renumber when closing windows
set-option -g base-index 1
set-option -g renumber-windows on

# Customize status line
set-option -g status-position bottom
# 🖥 Màu nền và chữ trong thanh trạng thái
set -g status-style "bg=#1A1B26,fg=#C0CAF5"
# 🎯 Tuỳ chỉnh status-left (tên TMUX)
set -g status-left "#[bg=#7AA2F7,fg=#1A1B26,bold] #S #[bg=#1A1B26,fg=#C0CAF5]"
# 📅 Tuỳ chỉnh status-right (hiển thị ngày giờ đẹp hơn)
set -g status-right 'Have A Good Day 😛'
# 📌 Màu cửa sổ trong thanh trạng thái
set -g window-status-style "fg=#C0CAF5,bg=#1A1B26"
# 🔹 Màu cho cửa sổ đang chọn (hiện tại)
set -g window-status-current-style "fg=#1A1B26,bg=#7AA2F7,bold"
# 🚀 Định dạng hiển thị cửa sổ bình thường
set -g window-status-format "#[fg=#9AA5CE] #I #[fg=#C0CAF5]#W "
# 🚀 Định dạng hiển thị cửa sổ đang chọn
set -g window-status-current-format "#[bg=#7AA2F7,fg=#1A1B26,bold] #I:#W "
# 🖼 Màu viền của pane
set -g pane-border-style "fg=#565F89"
set -g pane-active-border-style "fg=#7AA2F7"

# Reload tmux config
bind r source-file ~/.tmux.conf
